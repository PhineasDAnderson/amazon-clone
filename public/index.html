<!doctype html>
<!-- This is the one HTML page of the app. React builds the whole site inside the div with id "root" -->
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <!-- Small picture shown in the browser tab -->
    <link rel="icon" href="/Amazon-Smile-Logo-PNG-Photos.png" />

    <!-- Loads the Material Icons font so the search and cart icons work -->
    <link
      href="https://fonts.googleapis.com/icon?family=Material+Icons"
      rel="stylesheet"
    />

    <!-- Makes the page fit the width of a phone screen -->
    <meta name="viewport" content="width=device-width,initial-scale=1" />

    <!-- Colour of the browser bar on phones -->
    <meta name="theme-color" content="#000000" />

    <!-- Short description of the website -->
    <meta name="description" content="Amazon clone built with React" />

    <!-- Name shown in the browser tab -->
    <title>Amazon Clone</title>
  </head>

  <body>
    <!-- This message is shown if the browser has JavaScript turned off -->
    <noscript>You need to enable JavaScript to run this app.</noscript>

    <!-- This is so React puts the whole app inside this div -->
    <div id="root"></div>
  </body>
</html>
